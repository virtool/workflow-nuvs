[project]
name = "workflow-nuvs"
version = "0.0.0"
description = "A workflow for identifying novel viruses in Virtool."
authors = [
    {name="Ian Boyes"},
    {name="Reece Hoffmann"},
    {name="Blake Smith"},
    {name="Tiansheng Sui"},
    {name="Elizabeth Roberts"},
    {name="Markus Swoveland"},
    {name="Christine Wong Chong"},
]
license = "MIT"
requires-python = ">=3.12.3,<3.13"
dependencies = [
    "virtool-workflow==7.2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["ALL"]

[tool.maturin]
python-source = "python"

[dependency-groups]
dev = [
    "pydantic-factories>=1.17.3",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.9",
    "syrupy>=4.9.1,<5.0.0",
]
